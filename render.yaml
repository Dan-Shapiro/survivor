services:
  - type: web
    name: survivor
    runtime: ruby
    plan: free
    buildCommand: "bundle install && bin/rails assets:precompile"
    preDeployCommand: "bin/rails db:prepare"
    startCommand: "bin/thrust bin/rails server"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: true
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SCHEDULER_TOKEN
        sync: false
      - key: APP_HOST
        sync: false
      - key: MAILER_FROM
        sync: false
